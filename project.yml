name: AnokiXTrader
options:
  bundleIdPrefix: com.anokix
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AnokiXTrader:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AnokiXTrader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anokix.trader
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # Merge approach: a checked-in Info.plist holds the ATS cleartext-HTTP
        # exception for 155.117.20.51, while GENERATE_INFOPLIST_FILE merges the
        # INFOPLIST_KEY_* values below into it at build time (matches the
        # original hand-built .xcodeproj exactly).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AnokiXTrader/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "AnokiX Trader"
        INFOPLIST_KEY_NSCameraUsageDescription: "Capture your store logo and verification documents."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach your store logo and verification documents."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Branded launch screen (navy bg + white logo) is defined in
        # AnokiXTrader/Info.plist's UILaunchScreen dict, so don't auto-generate one.
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

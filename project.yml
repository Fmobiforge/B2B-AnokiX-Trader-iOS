name: AnokiXTrader
options:
  bundleIdPrefix: com.anokix
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AnokiXTrader:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # The entitlements file is referenced via CODE_SIGN_ENTITLEMENTS, not bundled.
      # GoogleService-Info.plist must land in the Resources phase (it's a .plist, so
      # pin its build phase explicitly rather than relying on the folder glob).
      - path: AnokiXTrader
        excludes:
          - "AnokiXTrader.entitlements"
          - "GoogleService-Info.plist"
      - path: AnokiXTrader/GoogleService-Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anokix.traderapp
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AnokiXTrader/AnokiXTrader.entitlements
        ENABLE_PREVIEWS: YES
        # Merge approach: a checked-in Info.plist holds the ATS cleartext-HTTP
        # exception for 109.176.30.129, while GENERATE_INFOPLIST_FILE merges the
        # INFOPLIST_KEY_* values below into it at build time (matches the
        # original hand-built .xcodeproj exactly).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: AnokiXTrader/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "AnokiX Trader"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan product barcodes and QR codes at the till, and capture your store logo and verification documents."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach your store logo and verification documents."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used to show your position on the map and help you find and confirm delivery addresses when placing orders."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Branded launch screen lives in AnokiXTrader/Base.lproj/LaunchScreen.storyboard
        # (navy bg + white logo constrained to 60% width). Point the app at it via
        # UILaunchStoryboardName and suppress the auto-generated empty launch screen.
        # Setting it here (not via the Xcode "Launch Screen File" UI) means it
        # survives `xcodegen generate` — regen rewrites the pbxproj and wipes any
        # launch-screen choice made through Xcode's UI.
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
